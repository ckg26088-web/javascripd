<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>この文字が置き換わります。</p>
    <button onclick="action()">
        文字を書き換える
    </button>

    <script>
        function action() {
            document.querySelector("p").textContent = "このような文字に置き換わりました。"
        }
    </script>
    

</body>     <!-- ここより牛をへの追加はきにゅしちゃだめ -->

</html>
